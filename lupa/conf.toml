# Configuration file for Lupa
# Uncomment a line to apply changes

[Aesthetic]
# Override's your GTK theme's color for the background color
# window_color="#0E231E" # String (Default: "var(--window-bg-color)", accepts a CSS color function or expression)

# The opacity for the window
opacity=0.8 # Float (Default: 1.0, Range: [0–1])

# The elevation factor of the entries in the results and sidebar
# Affects opacity and lightness of the entry's background color and should remain positive
entry_elevation = 1.6 # Float (Default: 1.2, Range: [1, 2])

# The rounding of the main window
# radius=15 # Integer (Default: 15, Range [0-u32 limit])

# The amount of visible entries
# entries=5.0 # Float (Default: 5.0, Range: [0–f32 limit])

# The height of each entry
# entry_size=64 #  Integer (Default: 64, Range: [0-i16 limit])

# The width of the window
# width=600 # Integer (Default: 600, Range: [0-u16 limit])

# The anchors for the launcher window
# Separate valid values by commas as shown
# anchors="" # String (Default: "", Values: "top, bottom, left, right")

[Behavior]
# Whether the launcher will close the moment it loses its active
# status by, for example, clicking off the launcher
close_when_unfocused=false # Boolean (Default: true)

# The maximum amount of file entries to add on search
# Be careful when setting this too high as it may cause
# lag spikes on 1-2 character searches
# max_file_entries=25 # Integer (Default: 25, Range: [0-u32 limit])

# The providers shown and the order they run in when there is no prefix present
# Separate valid values by commas as shown
# Case insensitive
fallback_providers="system, app, file, emoji, calc, web" # String (Default: "system, app, file, emoji, calc")
